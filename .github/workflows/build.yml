name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026
    outputs:
      package-version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "1.1.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Test
        shell: pwsh
        run: ctest --preset windows-ci-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: |
          ./.github/scripts/Package-Windows.ps1 `
            -Target x64 `
            -Configuration RelWithDebInfo `
            -PackageVersion "${{ steps.version.outputs.value }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-unsigned
          if-no-files-found: error
          path: |
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-windows-x64.exe
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-windows-x64.zip

  windows-sign:
    if: >-
      github.repository == 'prgmitchell/streamassistant-camera' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows-x64
    runs-on: windows-2025
    environment: windows-release
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: windows-release-signing
      cancel-in-progress: false
    env:
      WINDOWS_SIGNING_PUBLISHER: MITCHELL SOFTWARE SOLUTIONS LLC
      INSTALLER_PATH: release/streamassistant-camera-v${{ needs.windows-x64.outputs.package-version }}-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Azure signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID'
            'AZURE_TENANT_ID'
            'AZURE_SUBSCRIPTION_ID'
            'AZURE_ARTIFACT_SIGNING_ENDPOINT'
            'AZURE_ARTIFACT_SIGNING_ACCOUNT'
            'AZURE_ARTIFACT_SIGNING_PROFILE'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing windows-release environment variable: $name"
            }
          }

      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-unsigned
          path: release

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}/${{ env.INSTALLER_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: StreamAssistant Camera
          description-url: https://camera.streamassistant.app

      - name: Verify signed installer
        shell: pwsh
        run: |
          ./.github/scripts/Assert-Authenticode.ps1 `
            -Path $env:INSTALLER_PATH `
            -ExpectedPublisher $env:WINDOWS_SIGNING_PUBLISHER `
            -RequireTimestamp

      - name: Upload signed Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            ${{ env.INSTALLER_PATH }}
            release/streamassistant-camera-v${{ needs.windows-x64.outputs.package-version }}-windows-x64.zip

  macos-universal:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.1.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset macos-ci

      - name: Build
        run: cmake --build --preset macos-ci --parallel

      - name: Test
        run: ctest --preset macos-ci

      - name: Install
        run: cmake --install build_macos --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/release/RelWithDebInfo"

      - name: Package
        run: zsh .github/scripts/Package-macOS.zsh "${{ steps.version.outputs.value }}"

      - name: Verify package
        shell: bash
        run: |
          bundle="release/RelWithDebInfo/streamassistant-camera.plugin"
          binary="$bundle/Contents/MacOS/streamassistant-camera"
          package="release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.pkg"
          expanded="$RUNNER_TEMP/streamassistant-camera-package"

          architectures="$(lipo -archs "$binary")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          [[ "$(plutil -extract CFBundleIdentifier raw "$bundle/Contents/Info.plist")" == "app.streamassistant.camera" ]]
          codesign --verify --deep --strict "$bundle"
          pkgutil --expand "$package" "$expanded"
          grep -q 'enable_currentUserHome="true"' "$expanded/Distribution"
          grep -q 'enable_localSystem="false"' "$expanded/Distribution"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.pkg
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.zip

  release:
    if: github.ref_type == 'tag'
    needs:
      - windows-sign
      - macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed Windows packages
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release-assets

      - name: Download macOS packages
        uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum streamassistant-camera-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: StreamAssistant Camera ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Use an iPhone or Android phone as a camera source without installing a native phone app.

            The Windows installer is digitally signed by MITCHELL SOFTWARE SOLUTIONS LLC.
            The macOS package is unsigned and not notarized, so macOS may display a security warning.
          files: release-assets/*
