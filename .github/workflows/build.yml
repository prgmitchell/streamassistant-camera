name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "1.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Test
        shell: pwsh
        run: ctest --preset windows-ci-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: |
          ./.github/scripts/Package-Windows.ps1 `
            -Target x64 `
            -Configuration RelWithDebInfo `
            -PackageVersion "${{ steps.version.outputs.value }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-windows-x64.exe
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-windows-x64.zip

  macos-universal:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset macos-ci

      - name: Build
        run: cmake --build --preset macos-ci --parallel

      - name: Test
        run: ctest --preset macos-ci

      - name: Install
        run: cmake --install build_macos --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/release/RelWithDebInfo"

      - name: Package
        run: zsh .github/scripts/Package-macOS.zsh "${{ steps.version.outputs.value }}"

      - name: Verify package
        shell: bash
        run: |
          bundle="release/RelWithDebInfo/streamassistant-camera.plugin"
          binary="$bundle/Contents/MacOS/streamassistant-camera"
          package="release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.pkg"
          expanded="$RUNNER_TEMP/streamassistant-camera-package"

          architectures="$(lipo -archs "$binary")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          [[ "$(plutil -extract CFBundleIdentifier raw "$bundle/Contents/Info.plist")" == "app.streamassistant.camera" ]]
          codesign --verify --deep --strict "$bundle"
          pkgutil --expand "$package" "$expanded"
          grep -q 'enable_currentUserHome="true"' "$expanded/Distribution"
          grep -q 'enable_localSystem="false"' "$expanded/Distribution"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.pkg
            release/streamassistant-camera-v${{ steps.version.outputs.value }}-macos-universal.zip

  release:
    if: github.ref_type == 'tag'
    needs:
      - windows-x64
      - macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum streamassistant-camera-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: StreamAssistant Camera ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Use an iPhone or Android phone as a camera source without installing a native phone app.

            The Windows and macOS packages are unsigned, so the operating system may display a security warning.
          files: release-assets/*
